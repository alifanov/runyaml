name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ponytail: prisma client is generated code the typecheck needs; no DB required
      - run: pnpm --filter @runyaml/web exec prisma generate
      - run: pnpm -r run typecheck
      - run: pnpm --filter runyaml run build
