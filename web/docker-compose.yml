# Stack for the runyaml debug dashboard.
# Postgres is intentionally not exposed on a host port — only reachable
# from the `web` service via the internal docker network.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runyaml
      POSTGRES_PASSWORD: runyaml
      POSTGRES_DB: runyaml
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runyaml -d runyaml"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://runyaml:runyaml@db:5432/runyaml
    ports:
      - "4444:3000"
    command:
      - sh
      - -c
      # ponytail: prisma 7 dropped --skip-generate; db push no longer generates anyway
      - "node node_modules/prisma/build/index.js db push && pnpm start"

volumes:
  db-data:
